name: Release Please

on:
  workflow_run:
    workflows:
      - unit-test
    types:
      - completed
    branches:
      - main

permissions: {}

jobs:
  release-please:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    uses: muleyuck/github-actions/.github/workflows/release-please.yml@v1
    with:
      update-stable-tag: true
